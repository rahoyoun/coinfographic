<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홈페이지</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f9f7f4;
      --fg: #1a1a1a;
      --accent: #c8a96e;
      --muted: #888;
      --border: #e0ddd8;
      --max-width: 960px;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Georgia', 'Batang', serif;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      color: var(--fg);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--fg);
    }

    /* ── Main ── */
    main {
      flex: 1;
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 5rem 2rem;
    }

    .hero {
      text-align: center;
    }

    .hero-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: normal;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      color: var(--fg);
    }

    .hero p {
      max-width: 520px;
      margin: 0 auto 2.5rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      border: 1px solid var(--fg);
      color: var(--fg);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }

    .btn:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--accent);
      margin: 4rem auto;
    }

    /* ── Section ── */
    .section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2.5rem;
      text-align: center;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: normal;
      margin-bottom: 0.75rem;
    }

    .card p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">로고</a>
    <nav>
      <a href="#">소개</a>
      <a href="#">서비스</a>
      <a href="#">연락처</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="hero-label">Welcome</p>
      <h1>여기에 제목을<br>입력하세요</h1>
      <p>이 곳에 간단한 소개 문구를 작성해 주세요. 방문자에게 전달하고 싶은 핵심 메시지를 담아보세요.</p>
      <a href="#" class="btn">시작하기</a>
    </section>

    <div class="divider"></div>

    <section class="section">
      <div class="card">
        <h2>섹션 1</h2>
        <p>여기에 내용을 입력하세요.</p>
      </div>
      <div class="card">
        <h2>섹션 2</h2>
        <p>여기에 내용을 입력하세요.</p>
      </div>
      <div class="card">
        <h2>섹션 3</h2>
        <p>여기에 내용을 입력하세요.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 홈페이지. All rights reserved.</p>
  </footer>

</body>
</html>
