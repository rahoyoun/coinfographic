        <div class="panel-news-item">
          <div class="panel-news-top">
            <span class="panel-src ${n.source?.includes('KR') ? 'panel-src-ko' : n.source?.includes('CoinDesk') ? 'panel-src-cd' : 'panel-src-en'}">${n.source?.includes('KR') ? 'KR' : n.source?.includes('CoinDesk') ? 'CD' : 'EN'}</span>
            <a href="${n.link}" target="_blank" rel="noopener" class="panel-title">${n.title}</a>
          </div>
          ${n.desc ? `<div class="panel-desc">${n.desc}</div>` : ''}
          <div class="panel-date">${timeAgo(n.date)}</div>
        </div>
      `).join('') + `<a href="/news.html?symbol=${coin.symbol}&name=${encodeURIComponent(coin.name)}" class="panel-more">More news →</a>`;
    })
    .catch(() => { body.innerHTML = '<div class="panel-loading">Failed to load news</div>'; });
}

function closeNewsPanel() {
  document.getElementById('news-panel').classList.remove('open');
  document.getElementById('news-overlay').classList.remove('open');
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60) return `${Math.floor(diff)}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

/* Squarify */
function squarify(items,x,y,w,h){if(!items.length)return[];return _layout(items.map(i=>({...i})),x,y,w,h);}
function _layout(items,x,y,w,h){if(!items.length)return[];if(items.length===1)return[{...items[0],x,y,w,h}];const tot=items.reduce((s,i)=>s+i.a,0);let best=1,bR=Infinity;for(let n=1;n<=items.length;n++){const r=_worst(items.slice(0,n),w,h,tot);if(r<bR){bR=r;best=n;}else break;}const row=items.slice(0,best),rest=items.slice(best);const rA=row.reduce((s,i)=>s+i.a,0),frac=rA/tot;let rects,nx,ny,nw,nh;if(w>=h){const cw=w*frac;rects=_place(row,x,y,cw,h,false);nx=x+cw;ny=y;nw=w-cw;nh=h;}else{const rh=h*frac;rects=_place(row,x,y,w,rh,true);nx=x;ny=y+rh;nw=w;nh=h-rh;}if(!rest.length)return rects;const na=nw*nh,rt=rest.reduce((s,i)=>s+i.a,0);return[...rects,..._layout(rest.map(i=>({...i,a:i.a/rt*na})),nx,ny,nw,nh)];}
function _worst(row,w,h,tot){const rA=row.reduce((s,i)=>s+i.a,0),side=w>=h?h:w,rW=rA/tot*(w>=h?w:h);return row.reduce((m,i)=>{const iH=(i.a/rA)*side;return Math.max(m,Math.max(rW/iH,iH/rW));},0);}
function _place(row,x,y,w,h,hz){const tot=row.reduce((s,i)=>s+i.a,0);let cx=x,cy=y;return row.map(i=>{const f=i.a/tot;const r=hz?{...i,x:cx,y:cy,w:w*f,h}:{...i,x:cx,y:cy,w,h:h*f};hz?cx+=w*f:cy+=h*f;return r;});}

function buildRankBar(){
  document.getElementById('rank-label').textContent=t().rankLabel;
  document.querySelectorAll('.rbtn').forEach(b=>{
    const from=parseInt(b.dataset.from),to=parseInt(b.dataset.to);
    b.classList.toggle('on',from===rankFrom&&to===rankTo);
    b.onclick=()=>{rankFrom=from;rankTo=to;document.querySelectorAll('.rbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
  });
}

function applyLang(){
  document.documentElement.lang=lang;
  document.title=t().title+' — Live Cryptocurrency Market Visualization';
  document.getElementById('title').textContent=t().title;
  document.getElementById('legend-label').textContent=t().legendLabel;
  const mb=document.getElementById('metric-bar');mb.innerHTML='';
  Object.entries(t().metrics).forEach(([key,label])=>{
    const b=document.createElement('button');b.className='mbtn'+(metric===key?' on':'');b.dataset.m=key;b.textContent=label;
    b.addEventListener('click',()=>{metric=key;document.querySelectorAll('.mbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();});
    mb.appendChild(b);
  });
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  buildRankBar();buildCatBar();render();
}

function buildCatBar(){
  const bar=document.getElementById('cat-bar');bar.innerHTML='';
  const sorted=[...GROUPS].sort((a,b)=>a.order-b.order);
  const visible=showMore?sorted:sorted.filter(g=>g.show);
  const all=document.createElement('button');all.className='cbtn all-cbtn'+(activeCat==='all'?' on':'');all.textContent=t().all;
  all.onclick=()=>{activeCat='all';buildCatBar();render();};bar.appendChild(all);
  visible.forEach(g=>{
    const b=document.createElement('button');b.className='cbtn'+(activeCat===g.id?' on':'');b.style.background=g.color;b.textContent=t().groups[g.id];
    b.onclick=()=>{activeCat=g.id;buildCatBar();render();};bar.appendChild(b);
  });
  if(sorted.some(g=>!g.show)){const m=document.createElement('button');m.className='more-cbtn';m.textContent=showMore?t().less:t().more;m.onclick=()=>{showMore=!showMore;buildCatBar();};bar.appendChild(m);}
}

function render(){
  const container=document.getElementById('map');container.innerHTML='';
  const W=container.offsetWidth||window.innerWidth;
  const H=container.offsetHeight||500;
  let data=coins.filter(c=>{const rank=c.market_cap_rank||999;return rank>=rankFrom&&rank<=rankTo;});
  if(activeCat!=='all')data=data.filter(c=>gId(c.id)===activeCat);
  data=data.filter(c=>c[metric]!=null&&Math.abs(c[metric])>0);
  if(!data.length){container.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#475569;font-size:14px">${t().noCoins}</div>`;return;}
  data.sort((a,b)=>Math.abs(b[metric])-Math.abs(a[metric]));
  const tot=data.reduce((s,c)=>s+Math.abs(c[metric]),0);
  const items=data.map(c=>({coin:c,a:Math.abs(c[metric])/tot*W*H}));
  const rects=squarify(items,0,0,W,H);
  const tip=document.getElementById('tip');

  rects.forEach(r=>{
    const c=r.coin,ch=c.price_change_percentage_24h||0;
    const isHot=ch>=10;
    const el=document.createElement('div');el.className='tile';
    el.style.cssText=`left:${r.x+.5}px;top:${r.y+.5}px;width:${Math.max(r.w-1,2)}px;height:${Math.max(r.h-1,2)}px;background:${gColor(c.id)};border-bottom:3px solid ${chColor(ch)}${isHot?';box-shadow:inset 0 0 0 2px rgba(251,191,36,.4)':''}`;
    const minD=Math.min(r.w,r.h);
    if(isHot&&minD>30){const hot=document.createElement('div');hot.className='t-hot';hot.textContent='🔥';el.appendChild(hot);}
    if(minD>50&&c.market_cap_rank){const rk=document.createElement('div');rk.className='t-rank';rk.textContent='#'+c.market_cap_rank;el.appendChild(rk);}
    if(minD>24){const s=document.createElement('div');s.className='t-sym';s.style.fontSize=Math.min(Math.max(minD*.24,10),22)+'px';s.textContent=c.symbol.toUpperCase();el.appendChild(s);}
    if(minD>42){const v=document.createElement('div');v.className='t-val';v.style.fontSize=Math.min(Math.max(minD*.16,9),14)+'px';v.textContent=fmtNum(c,metric);el.appendChild(v);}
    if(minD>64&&metric!=='price_change_percentage_24h'){const cv=c.price_change_percentage_24h||0;const ce=document.createElement('div');ce.className='t-chg';ce.style.fontSize=Math.min(Math.max(minD*.14,8),12)+'px';ce.style.color=chColor(cv)+'dd';ce.textContent=(cv>=0?'▲':'▼')+Math.abs(cv).toFixed(2)+'%';el.appendChild(ce);}
    if(minD>80&&activeCat==='all'){const cat=document.createElement('div');cat.className='t-cat';cat.textContent=gLabel(c.id);el.appendChild(cat);}

    el.addEventListener('mouseenter',()=>{
      const cv=c.price_change_percentage_24h||0;tip.style.display='block';
      tip.innerHTML=`<div class="tt-hd">${c.name}<span style="color:#475569;font-size:11px;font-weight:400">${c.symbol.toUpperCase()}</span><span class="tt-rank">#${c.market_cap_rank||'?'}</span></div><div style="margin-bottom:6px"><span class="tt-badge" style="background:${gColor(c.id)}">${gLabel(c.id)}</span>${isHot?'<span style="margin-left:4px;font-size:10px">🔥 +10%</span>':''}</div><div class="tt-r"><span>${t().tip.price}</span><span class="tt-v">${fmtNum(c,'current_price')}</span></div><div class="tt-r"><span>${t().tip.mcap}</span><span class="tt-v">${fmtNum(c,'market_cap')}</span></div><div class="tt-r"><span>${t().tip.chg}</span><span class="tt-v" style="color:${chColor(cv)}">${(cv>=0?'+':'')+cv.toFixed(2)+'%'}</span></div><div class="tt-r"><span>${t().tip.vol}</span><span class="tt-v">${fmtNum(c,'total_volume')}</span></div><div style="margin-top:8px;font-size:10px;color:#475569">클릭하면 뉴스 패널 열림</div>`;
    });
    el.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';});
    el.addEventListener('mouseleave',()=>tip.style.display='none');

    // 클릭하면 뉴스 패널 열기
    el.addEventListener('click',()=>{
      tip.style.display='none';
      openNewsPanel(c);
    });

    container.appendChild(el);
  });
}

async function load(){
  const status=document.getElementById('status');
  status.textContent=t().loading;
  try{
    const r=await fetch(WORKERS_URL);
    if(!r.ok)throw 0;
    coins=await r.json();
    coins.forEach(c=>{if(!CMAP[c.id])CMAP[c.id]='other';});
    status.textContent=t().coinsLoaded(coins.length);
  }catch{
    status.textContent=t().sampleData;
    coins=[];
  }
  applyLang();
}

document.querySelectorAll('.lbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    lang=b.dataset.lang;
    const url=new URL(location);url.searchParams.set('lang',lang);history.replaceState(null,'',url);
    applyLang();
  });
});
window.addEventListener('resize',()=>render());
load();
</script>
