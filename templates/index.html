<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>파일 다운로더</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #252525;
      --accent: #4ade80;
      --accent-dim: #166534;
      --text: #e5e5e5;
      --muted: #555;
      --error: #f87171;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .wrap {
      width: 100%;
      max-width: 580px;
    }

    .title {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: normal;
      color: var(--accent);
      margin-bottom: 2.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.75rem 1.5rem;
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: var(--accent);
      color: #000;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Info card */
    .info-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .info-card.visible { display: block; }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child { border-bottom: none; }

    .info-label { color: var(--muted); }
    .info-value { color: var(--text); word-break: break-all; text-align: right; max-width: 60%; }

    .dl-btn {
      width: 100%;
      padding: 0.9rem;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    /* Error */
    .error {
      display: none;
      background: #1a0a0a;
      border: 1px solid #3a1a1a;
      color: var(--error);
      padding: 1rem 1.25rem;
      font-size: 0.8rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      white-space: pre-line;
    }

    .error.visible { display: block; }

    /* Spinner */
    .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    .spinner.visible { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.8;
      margin-top: 2rem;
    }

    .hint span { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title">File Downloader</p>
    <h1>파일 다운로더</h1>

    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://example.com/video.mp4" />
      <button id="checkBtn" onclick="checkURL()">확인</button>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="info-card" id="infoCard">
      <div class="info-row">
        <span class="info-label">파일명</span>
        <span class="info-value" id="infoName">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">형식</span>
        <span class="info-value" id="infoType">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">크기</span>
        <span class="info-value" id="infoSize">—</span>
      </div>
      <button class="btn dl-btn" onclick="startDownload()">⬇ 다운로드</button>
    </div>

    <div style="text-align:center; margin: 1rem 0;">
      <span class="spinner" id="spinner"></span>
    </div>

    <div class="hint">
      <span>지원 형식:</span> mp4, webm, mp3, wav, ogg, jpg, png, gif, pdf 등<br>
      <span>주의:</span> 직접 파일 URL만 지원됩니다 (.mp4 등으로 끝나는 링크)<br>
      <span>저작권:</span> 저작권이 없는 공개 파일만 다운로드하세요
    </div>
  </div>

  <script>
    const urlInput = document.getElementById("urlInput");
    const checkBtn = document.getElementById("checkBtn");
    const spinner = document.getElementById("spinner");
    const errorBox = document.getElementById("errorBox");
    const infoCard = document.getElementById("infoCard");

    urlInput.addEventListener("keydown", e => {
      if (e.key === "Enter") checkURL();
    });

    function setLoading(on) {
      checkBtn.disabled = on;
      spinner.classList.toggle("visible", on);
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add("visible");
      infoCard.classList.remove("visible");
    }

    function hideError() {
      errorBox.classList.remove("visible");
    }

    async function checkURL() {
      const url = urlInput.value.trim();
      if (!url) return;

      hideError();
      infoCard.classList.remove("visible");
      setLoading(true);

      try {
        const res = await fetch("/info", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || "오류가 발생했습니다.");
          return;
        }

        document.getElementById("infoName").textContent = data.filename;
        document.getElementById("infoType").textContent = data.content_type;
        document.getElementById("infoSize").textContent = data.size;
        infoCard.classList.add("visible");

      } catch (e) {
        showError("서버 오류가 발생했습니다.");
      } finally {
        setLoading(false);
      }
    }

    function startDownload() {
      const url = urlInput.value.trim();
      if (!url) return;
      window.location.href = `/download?url=${encodeURIComponent(url)}`;
    }
  </script>
</body>
</html>
