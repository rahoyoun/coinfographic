<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Courier New', monospace;
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      border: 1px solid #2a2a2a;
      background: #181818;
    }

    .label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: normal;
      color: #e8e8e8;
      letter-spacing: 0.05em;
    }

    .accent {
      color: #6ee7a0;
    }

    .sub {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">Flask · Python</p>
    <h1><span class="accent">{{ message }}</span></h1>
    <p class="sub">서버가 정상적으로 실행 중입니다.</p>
  </div>
</body>
</html>
